<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <rect id="_bg_" width="512" height="512" x="0" y="0" rx="128" fill="url(#_gradient_)" stroke="#FFFFFF" stroke-width="0" stroke-opacity="100%" paint-order="stroke"></rect>
  <clipPath id="clip">
    <use xlink:href="#_bg_"></use>
  </clipPath>
  <defs>
    <radialGradient id="_gradient_" cx="50%" cy="50%" r="100%" fx="50%" fy="50%" gradientUnits="objectBoundingBox">
      <stop stop-color="#FAF5E6"></stop>
      <stop offset="0.9" stop-color="#E7DBBB"></stop>
    </radialGradient>
  </defs>
  <svg width="472" height="472" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" x="40" y="40" alignment-baseline="middle" style="color: rgb(42, 26, 0); width: 352px; height: 352px;">
    <!-- Background Frame (dashed to look like a canvas/selection) -->
    <rect x="96" y="96" width="320" height="320" rx="36" stroke="#06490E" stroke-width="20" stroke-linejoin="round" stroke-dasharray="24 16"/>
    
    <!-- Bezier Curve Path -->
    <path d="M140 330 C200 330, 200 180, 256 180 C312 180, 312 330, 372 330" stroke="#06490E" stroke-width="24" stroke-linecap="round" fill="none"/>
    
    <!-- Handle Lines for the center node -->
    <line x1="180" y1="180" x2="332" y2="180" stroke="#06490E" stroke-width="10"/>
    
    <!-- Handle Circles -->
    <circle cx="180" cy="180" r="16" fill="#FAF5E6" stroke="#06490E" stroke-width="10"/>
    <circle cx="332" cy="180" r="16" fill="#FAF5E6" stroke="#06490E" stroke-width="10"/>
    
    <!-- Anchor Points (Squares) -->
    <!-- Start Anchor -->
    <rect x="124" y="314" width="32" height="32" rx="4" fill="#FAF5E6" stroke="#06490E" stroke-width="10"/>
    <!-- Center Anchor -->
    <rect x="240" y="164" width="32" height="32" rx="4" fill="#06490E" stroke="#06490E" stroke-width="4"/>
    <!-- End Anchor -->
    <rect x="356" y="314" width="32" height="32" rx="4" fill="#FAF5E6" stroke="#06490E" stroke-width="10"/>
  </svg>
</svg>
