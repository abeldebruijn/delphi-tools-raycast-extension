<svg
  width="512"
  height="512"
  viewBox="0 0 512 512"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>
  <rect width="512" height="512" rx="128" fill="url(#scroll-gradient)" />
  
  <!-- Circle split between Tile 1 and Tile 2 -->
  <circle
    cx="204"
    cy="210"
    r="36"
    stroke="#06490E"
    stroke-width="18"
    fill="none"
  />

  <!-- Three adjacent tiles representing the scroll frames -->
  <rect
    x="110"
    y="146"
    width="84"
    height="220"
    rx="16"
    stroke="#06490E"
    stroke-width="20"
    fill="none"
  />
  <rect
    x="214"
    y="146"
    width="84"
    height="220"
    rx="16"
    stroke="#06490E"
    stroke-width="20"
    fill="none"
  />
  <rect
    x="318"
    y="146"
    width="84"
    height="220"
    rx="16"
    stroke="#06490E"
    stroke-width="20"
    fill="none"
  />

  <!-- Wavy curve flowing seamlessly across all three tiles -->
  <path
    d="M 90 320 C 150 200, 200 300, 260 220 C 310 160, 370 280, 422 240"
    stroke="#06490E"
    stroke-width="20"
    stroke-linecap="round"
    fill="none"
  />

  <defs>
    <radialGradient
      id="scroll-gradient"
      cx="0"
      cy="0"
      r="1"
      gradientUnits="userSpaceOnUse"
      gradientTransform="translate(256 256) rotate(90) scale(512)"
    >
      <stop stop-color="#FAF5E6" />
      <stop offset="0.9" stop-color="#E7DBBB" />
    </radialGradient>
  </defs>
</svg>
