<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="512" height="512" rx="128" fill="url(#split-gradient)" />
  
  <!-- 2x2 Grid of separated tiles -->
  <rect x="110" y="110" width="132" height="132" rx="20" stroke="#06490E" stroke-width="28" fill="none" />
  <rect x="270" y="110" width="132" height="132" rx="20" stroke="#06490E" stroke-width="28" fill="none" />
  <rect x="110" y="270" width="132" height="132" rx="20" stroke="#06490E" stroke-width="28" fill="none" />
  <rect x="270" y="270" width="132" height="132" rx="20" stroke="#06490E" stroke-width="28" fill="none" />

  <!-- Split line markers in the center gaps -->
  <path d="M256 90V422" stroke="#06490E" stroke-width="12" stroke-dasharray="24 16" opacity="0.3" stroke-linecap="round" />
  <path d="M90 256H422" stroke="#06490E" stroke-width="12" stroke-dasharray="24 16" opacity="0.3" stroke-linecap="round" />

  <defs>
    <radialGradient
      id="split-gradient"
      cx="0"
      cy="0"
      r="1"
      gradientUnits="userSpaceOnUse"
      gradientTransform="translate(256 256) rotate(90) scale(512)"
    >
      <stop stop-color="#FAF5E6" />
      <stop offset="0.9" stop-color="#E7DBBB" />
      <stop offset="1" stop-color="#E7DBBB" />
    </radialGradient>
  </defs>
</svg>
